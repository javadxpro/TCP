name: Inspect tool zip
on: workflow_dispatch
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download E -R ${{ github.repository }} -p mphos-rebuild-tool.zip
          unzip -l mphos-rebuild-tool.zip > list.txt
          tail -1 list.txt
          awk 'NR>3{print $4}' list.txt | cut -d/ -f1-3 | sort -u | head -60 > top.txt
          i=0; while read l; do i=$((i+1)); echo "::notice title=f$i::$l"; done < <(split -l 12 --filter='paste -sd"|"' top.txt)
